name: Update NeetCode Progress

on:
  push:
    branches:
      - main
    paths:
      - "**/submission-*"

  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count synced submissions and current streak
        id: progress
        shell: bash
        run: |
          python <<'PY'
          import os
          import subprocess
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          timezone = ZoneInfo("America/New_York")

          submissions = [
              submission
              for submission in Path(".").rglob("submission-*")
              if submission.is_file()
          ]

          if not submissions:
              raise SystemExit("Could not find any synced submission files.")

          total = len(submissions)

          print(f"Synced submissions: {total}")

          tracked_roots = sorted(
              {
                  submission.relative_to(Path(".")).parts[0]
                  for submission in submissions
              }
          )

          log_output = subprocess.run(
              [
                  "git",
                  "log",
                  "--format=%cI",
                  "--",
                  *tracked_roots,
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout

          commit_days = {
              datetime.fromisoformat(timestamp).astimezone(timezone).date()
              for timestamp in log_output.splitlines()
              if timestamp.strip()
          }

          today = datetime.now(timezone).date()
          streak = 0
          current_day = today

          while current_day in commit_days:
              streak += 1
              current_day -= timedelta(days=1)

          print(f"Current streak: {streak} days")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"total={total}\n")
              output.write(f"streak={streak}\n")
          PY

      - name: Update repository description
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          DESCRIPTION: >-
            Current Streak: ${{ steps.progress.outputs.streak }} 🔥
            | Problems Solved: ${{ steps.progress.outputs.total }} ✅
        run: |
          echo "Updating description to: $DESCRIPTION"

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}" \
            -f description="$DESCRIPTION"
