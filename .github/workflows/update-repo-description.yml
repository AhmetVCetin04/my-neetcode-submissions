name: Update NeetCode Progress

on:
  push:
    branches:
      - main
    paths:
      - "**/submission-*"

  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count synced submissions and current streak
        id: progress
        shell: bash
        run: |
          python <<'PY'
          import os
          import subprocess
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          timezone = ZoneInfo("America/New_York")

          def submission_index(path: Path) -> int:
              try:
                  return int(path.stem.split("-")[-1])
              except ValueError as exc:
                  raise SystemExit(
                      f"Could not parse submission index from {path}"
                  ) from exc

          all_submissions = [
              submission
              for submission in Path(".").rglob("submission-*")
              if submission.is_file()
          ]

          if not all_submissions:
              raise SystemExit("Could not find any synced submission files.")

          accepted_submissions_by_problem = {}
          for submission in all_submissions:
              problem = submission.parent.relative_to(Path("."))
              current = accepted_submissions_by_problem.get(problem)
              if current is None or submission_index(submission) > submission_index(current):
                  accepted_submissions_by_problem[problem] = submission

          accepted_submissions = sorted(accepted_submissions_by_problem.values())
          total = len(accepted_submissions)

          print(f"Problems solved: {total}")

          log_output = subprocess.run(
              [
                  "git",
                  "log",
                  "--format=__COMMIT__%cI",
                  "--name-only",
                  "--",
                  ".",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout

          commit_days = set()
          current_timestamp = None
          touched_submission = False

          for line in log_output.splitlines():
              if line.startswith("__COMMIT__"):
                  if current_timestamp and touched_submission:
                      commit_days.add(
                          datetime.fromisoformat(current_timestamp)
                          .astimezone(timezone)
                          .date()
                      )
                  current_timestamp = line.removeprefix("__COMMIT__")
                  touched_submission = False
                  continue

              if not line.strip():
                  continue

              if Path(line).name.startswith("submission-"):
                  touched_submission = True

          if current_timestamp and touched_submission:
              commit_days.add(
                  datetime.fromisoformat(current_timestamp)
                  .astimezone(timezone)
                  .date()
              )

          today = datetime.now(timezone).date()
          streak = 0
          current_day = today if today in commit_days else today - timedelta(days=1)

          while current_day in commit_days:
              streak += 1
              current_day -= timedelta(days=1)

          print(f"Current streak: {streak} days")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"total={total}\n")
              output.write(f"streak={streak}\n")
          PY

      - name: Update repository description
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          DESCRIPTION: >-
            Current Streak 🔥: ${{ steps.progress.outputs.streak }}
            | Accepted Submissions ✅: ${{ steps.progress.outputs.total }}
        run: |
          echo "Updating description to: $DESCRIPTION"

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}" \
            -f description="$DESCRIPTION"
